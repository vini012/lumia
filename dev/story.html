<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lumiar · bancada da progressão</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc6ec;font-family:system-ui,sans-serif;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
/* dev panel (not part of the game) */
#dev{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:8px;z-index:80;max-width:min(330px,60vw);max-height:calc(100vh - 16px);overflow:auto;font:12px/1.3 system-ui,sans-serif;color:#fff;background:rgba(20,26,40,.72);border-radius:10px;padding:6px 8px;backdrop-filter:blur(4px)}
#dev summary{cursor:pointer;font-weight:700}
#dev button{font:inherit;margin:2px;padding:5px 8px;border:0;border-radius:6px;background:#3e5a8a;color:#fff;cursor:pointer}
#dev button:active{background:#5d7fb8}
#dev .row{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:4px 0}
#dev pre{white-space:pre-wrap;margin:4px 0;max-height:40vh;overflow:auto;font:11px/1.25 ui-monospace,monospace}
#dev input[type=range]{width:150px}
/* placeholder of the game's own HUD, only to judge the composition (the real one belongs to the game) */
#ghud{position:fixed;inset:0;pointer-events:none;z-index:10}
#ghud i{position:absolute;border-radius:50%;border:2px solid rgba(255,250,240,.55);background:rgba(28,36,60,.35);box-shadow:0 6px 16px rgba(0,0,0,.25)}
/* same places and sizes as the v4 touch layout (index.html #btns, #joyHint, .tr), including its short-screen rules */
#ghud{--r:env(safe-area-inset-right,0px);--b:env(safe-area-inset-bottom,0px);--t:env(safe-area-inset-top,0px)}
#ghud .act{right:calc(14px + var(--r));bottom:calc(14px + var(--b));width:110px;height:110px}
#ghud .jmp{right:calc(132px + var(--r));bottom:calc(16px + var(--b));width:62px;height:62px}
#ghud .alt{right:calc(140px + var(--r));bottom:calc(88px + var(--b));width:54px;height:54px}
#ghud .bag{right:calc(80px + var(--r));bottom:calc(164px + var(--b));width:54px;height:54px}
#ghud .bld{right:calc(20px + var(--r));bottom:calc(134px + var(--b));width:54px;height:54px}
#ghud .emo{right:calc(142px + var(--r));bottom:calc(154px + var(--b));width:46px;height:46px}
#ghud .joy{left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + var(--b));width:110px;height:110px;border-style:dashed;background:none;box-shadow:none}
#ghud .mini{right:calc(10px + var(--r));top:calc(8px + var(--t));width:132px;height:132px}
#ghud .icons{right:calc(150px + var(--r));top:calc(8px + var(--t));width:126px;height:74px;border-radius:12px}
@media (max-height:430px){
 #ghud .act{width:96px;height:96px}#ghud .jmp{right:calc(118px + var(--r));width:54px;height:54px}#ghud .alt{right:calc(124px + var(--r));bottom:calc(78px + var(--b));width:48px;height:48px}
 #ghud .bld{bottom:calc(118px + var(--b));width:48px;height:48px}#ghud .bag{right:calc(72px + var(--r));bottom:calc(146px + var(--b));width:48px;height:48px}
 #ghud .emo{right:calc(126px + var(--r));bottom:calc(136px + var(--b));width:42px;height:42px}#ghud .joy{width:90px;height:90px}
 #ghud .mini{width:112px;height:112px}#ghud .icons{right:calc(130px + var(--r))}}
#ghud .bars{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px}
#ghud .bars b{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,250,240,.55);background:rgba(28,36,60,.35)}
#prompt{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:11;display:none;padding:6px 12px;border-radius:12px;background:rgba(28,36,60,.6);color:#fff7e6;font:600 14px/1.2 system-ui,sans-serif}
body.lu-cinema #ghud,body.lu-cinema #prompt{opacity:0;transition:opacity .8s}
body.shots #dev{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ghud"><i class="joy"></i><i class="act"></i><i class="jmp"></i><i class="alt"></i><i class="bag"></i><i class="bld"></i><i class="emo"></i><i class="mini"></i><i class="icons"></i><div class="bars"><b></b><b></b><b></b><b></b></div></div>
<div id="prompt"></div>
<details id="dev" open><summary>bancada</summary>
  <div class="row"><button data-a="chain">rodar a cadeia inteira</button><button data-a="mid">meio do jogo</button></div>
  <div class="row" id="scenes"></div>
  <div class="row">hora <input id="hour" type="range" min="0" max="24" step=".25" value="9"><span id="hourv">9</span></div>
  <div class="row"><button data-a="journal">diário (J)</button><button data-a="spells">magias (M)</button><button data-a="use">usar (E)</button><button data-a="sleep">dormir</button></div>
  <pre id="log">WASD anda · arraste gira · E usa · J diário · M magias</pre>
</details>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="../js/lore.js"></script>
<script>/* helpers the engine normally provides (rig.js reads them at load) */ window.L = window.L || {}; L.clamp = (x, a, b) => Math.max(a, Math.min(b, x)); L.lerp = (a, b, t) => a + (b - a) * t; L.sstep = (a, b, x) => { const t = L.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };</script>
<script src="../js/rig.js"></script>
<script src="story_mocks.js"></script>
<script src="../js/story.js"></script>
<script src="../js/storyui.js"></script>
<script src="story_chain.js"></script>
<script src="story_dev.js"></script>
</body>
</html>
