<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9cc6ec">
<title>Lumiar</title>
<link rel="preload" href="assets/fonts/grandstander.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="game"></div>

<!-- carregamento (dicas neutras em js/ui.js) -->
<div id="loading">
  <div class="logo">Lumiar</div>
  <div class="card paper"><div class="tape"></div>
    <div id="lbarW"><div id="lbar"></div></div>
    <div id="ltxt">Preparando o mundo…</div>
    <div id="ltip"></div>
  </div>
</div>

<!-- tela inicial -->
<div id="start" hidden>
  <div class="card paper"><div class="tape"></div><div class="tape b" style="left:auto;right:18px;top:-9px"></div>
    <h1>Lumiar</h1>
    <div class="sub">um mundo acima das nuvens, para dois</div>
    <div class="cols">
      <div>
        <label for="nm">Seu nome</label>
        <input id="nm" maxlength="16" placeholder="Seu nome" autocomplete="off" spellcheck="false">
        <label for="wc" style="margin-top:8px">Código do mundo</label>
        <input id="wc" maxlength="24" placeholder="nosso-mundo" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div>
        <label>Personagem</label>
        <div id="who">
          <button class="btn" data-g="f" type="button"><svg viewBox="0 0 40 40"><circle cx="20" cy="9" r="5.5" fill="#6b4630"/><circle cx="20" cy="18" r="8" fill="#f1d3b5" stroke="#5a3f2e" stroke-width="1.6"/><path d="M12 17c0-6 4-9 8-9s8 3 8 9c-2-3-5-4-8-4s-6 1-8 4z" fill="#6b4630"/><path d="M9 39c1-8 5-12 11-12s10 4 11 12z" fill="#b2dafc" stroke="#5a3f2e" stroke-width="1.6"/></svg>Ela</button>
          <button class="btn" data-g="m" type="button"><svg viewBox="0 0 40 40"><circle cx="20" cy="17" r="8" fill="#f1d3b5" stroke="#5a3f2e" stroke-width="1.6"/><path d="M12 16c0-6 4-8 8-8s8 2 8 8c-3-2-5-3-8-3s-5 1-8 3z" fill="#5a3f2e"/><path d="M9 39c1-8 5-12 11-12s10 4 11 12z" fill="#8b5a3c" stroke="#5a3f2e" stroke-width="1.6"/><path d="M14 27h12l-2 3h-8z" fill="#4a7fc0"/></svg>Ele</button>
        </div>
        <label style="margin-top:8px">Cores da roupa</label>
        <div id="sws"></div>
      </div>
    </div>
    <div class="go"><button id="enter" class="btn big" type="button">Entrar</button></div>
    <div class="tip">Usem o mesmo código de mundo nos dois celulares para jogarem juntos. Melhor na horizontal.</div>
  </div>
</div>

<!-- HUD (fase A: só o essencial; B-ui faz o layout completo) -->
<div id="hud" hidden>
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="topR">
    <button id="bJournal" class="ico" type="button" title="Diário" aria-label="Diário"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/><path d="M9 8h6"/></svg></button>
    <button id="bMap" class="ico" type="button" title="Mapa" aria-label="Mapa"><svg viewBox="0 0 24 24"><path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
    <button id="mini" type="button" title="Mapa" aria-label="Mapa"><canvas id="miniCv" width="236" height="236"></canvas><span id="clock">--:--</span></button>
  </div>
  <div id="toasts"></div>
  <div id="hint" hidden></div>
  <div id="btns">
    <button id="bAct" type="button" aria-label="Ação"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14c0 3.5-2.5 6-6 6s-5-2-6.5-4.5L3 12.5a1.4 1.4 0 0 1 2.3-1.6L8 14"/></svg><small id="actLb">ação</small></button>
    <button id="bJump" type="button" aria-label="Pular"><svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg><small>pular</small></button>
    <button id="bMagic" type="button" aria-label="Magia"><svg viewBox="0 0 24 24"><path d="M5 19 15 9"/><path d="M15.5 3.5l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9zM19.5 11l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z"/></svg><small>magia</small></button>
    <button id="bBag" type="button" aria-label="Bolsa"><svg viewBox="0 0 24 24"><path d="M6 9h12l-1 11H7z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg></button>
    <button id="bBuild" type="button" aria-label="Construir"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.5V20h11V9.5"/><path d="M10.5 20v-5h3v5"/></svg></button>
  </div>
</div>

<!-- painéis (Bolsa, Construir, Mapa, Baú, Ajuda, Config): B-ui -->
<div id="panels"></div>

<div id="rotate"><div class="paper"><div class="tape"></div>Vire o celular na horizontal para jogar</div></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="js/engine.js"></script>
<script src="js/lore.js"></script>
<script src="js/sky.js"></script>
<script src="js/terramat.js"></script>
<script src="js/flora.js"></script>
<script src="js/terrain.js"></script>
<script src="js/scatter.js"></script>
<script src="js/grass.js"></script>
<script src="js/rig.js"></script>
<script src="js/world.js"></script>
<script src="js/creatures.js"></script>
<script src="js/player.js"></script>
<script src="js/build.js"></script>
<script src="js/save.js"></script>
<script src="js/survival.js"></script>
<script src="js/farm.js"></script>
<script src="js/story.js"></script>
<script src="js/items.js"></script>
<script src="js/ui.js"></script>
<script src="js/storyui.js"></script>
<script src="js/survui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
